[project]
name = "myfxbookcopying"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=5.3.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "fastapi>=0.115.0",
    "fear-and-greed>=0.4",
    "ipython>=9.4.0",
    "jinja2>=3.1.6",
    # numpy 2.4 raised its wheel baseline to x86-64-v2 (SSE4.2). The k3s node is a
    # KVM guest exposing only x86-64-v1, so >=2.4 crashes at import with
    # "NumPy was built with baseline optimizations: (X86_V2)". Keep on the 2.3.x line.
    "numpy<2.4",
    "pandas>=2.3.1",
    "plotly>=5.24.0",
    "psycopg2-binary>=2.9.10",
    "pyportfolioopt>=1.5.6",
    "quantstats>=0.0.62",
    "scikit-learn>=1.7.1",
    "sqlalchemy>=2.0.42",
    "ta>=0.11.0",
    "telethon>=1.36.0",
    "tqdm>=4.67.1",
    "uvicorn>=0.32.0",
    "yfinance>=0.2.65",
    "boto3>=1.35.0",
    "huggingface_hub>=0.20.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "ibind[oauth]>=0.1.23",
    # Hyperliquid perps DEX SDK (Info/Exchange). Pure-Python + eth-account;
    # pulls no numpy, so the numpy<2.4 pin above is unaffected.
    "hyperliquid-python-sdk>=0.24.0",
]
[project.optional-dependencies]
dev = [
    "catboost>=1.2.8",
    "imbalanced-learn>=0.12.4",
    "ipykernel>=6.30.0",
    "matplotlib>=3.10.5",
    "pandas>=2.3.1",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "scikit-learn>=1.7.1",
    "tqdm>=4.67.1",
    "xgboost>=3.0.3",
    "yfinance>=0.2.65",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.uv.sources]
imbalanced-learn = { git = "https://github.com/scikit-learn-contrib/imbalanced-learn", rev = "master" }

[dependency-groups]
dev = [
    "debugpy>=1.8.20",
    "mypy>=2.3.0",
    "openpyxl>=3.1.5",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
# Both roots, because tests import via `tradingbot.utils.X` while the modules
# under test import each other as `utils.X` (the layout the container gets from
# `COPY tradingbot/ /app/`). Keep a single test module on ONE of these roots:
# importing the same class under both names yields two distinct classes.
pythonpath = [".", "tradingbot"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    ".claude",
    "exploration",
    "scripts/nilsson_submission",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",    # line length is handled by `ruff format`; remaining long lines
               # are intentional (LLM prompt strings, error-message f-strings)
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode: internal codebase uses
                                    # em-dashes/curly quotes intentionally
]

[tool.ruff.lint.isort]
known-first-party = ["tradingbot", "utils", "livetrade"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
exclude = [
    "^exploration/",
    "^kronos_space/",
    "^scripts/nilsson_submission/",
]

[[tool.mypy.overrides]]
module = ["utils", "utils.*", "livetrade", "livetrade.*", "adaptivemeanreversionbot"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ta.*", "yfinance.*", "hyperliquid.*", "ibind.*", "telethon.*", "pypfopt.*",
    "sklearn.*", "boto3.*", "botocore.*", "psycopg2.*", "pandas.*",
    "fear_and_greed", "cachetools.*", "scipy.*", "tqdm.*",
]
ignore_missing_imports = true
