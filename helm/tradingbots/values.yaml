# Default values for tradingbots Helm chart
# This file configures all trading bots, their schedules, and deployment settings.

# Docker image configuration
# All bots run from the same container image
image:
  repository: registry.gitlab.com/datafortress/tradingbot25
  # This must stay in sync with .gitlab-ci.yml: build-docker pushes exactly one
  # tag, :main, and the deploy job passes --set image.tag=main. Any other value
  # here or there names a tag nothing publishes, and every CronJob in the chart
  # goes ImagePullBackOff with "manifest unknown" — see the 2026-08-18 outage.
  tag: main
  # Always, and it MUST stay Always while :main is the deployed tag. The tag is
  # mutable (it was an immutable $CI_COMMIT_SHA until 1f99c0f), so under
  # IfNotPresent kubelet sees the name already cached and never re-pulls — a
  # deploy then silently has no effect and the node keeps running whatever :main
  # it happened to cache. That stranded the fleet on a pre-import-root-migration
  # image on 2026-08-24: every job crashed with "No module named 'tradingbot'"
  # while the registry's :main was correct all along.
  #
  # The cost is real and known: a registry auth round-trip on every job start,
  # ~1.4k pulls/day against gitlab.com from the */5 CronJobs. When one times out
  # the job dies — xauzenbot and xauaisyntheticmetalbot both failed at 13:45 and
  # again at 13:53 on 2026-08-17, and xauaisyntheticmetalbot hit ErrImagePull on
  # 2026-08-18 ("Client.Timeout exceeded while awaiting headers"). If that noise
  # becomes intolerable, the fix is immutable SHA tags + IfNotPresent, NOT
  # flipping this back on its own.
  pullPolicy: Always

# Kubernetes namespace for all resources
namespace: tradingbots-2025

# Kubernetes secret name
# This secret must be created manually before deploying (see README.md)
# All secrets (database, API keys, passwords) are stored in this single secret
secretName: tradingbot-secrets # managed by `ske apply` from .env.secret.enc (see [tool.ske] in pyproject.toml)

# Image pull secrets for private Docker registry authentication
imagePullSecrets:
- name: regcred

# Resource limits for trading bot containers
# These apply to all bot CronJobs
resources:
  # Minimum resources requested (for scheduling)
  requests:
    cpu: 10m # 0.01 CPU cores
    memory: 25Mi # 25 megabytes
  # Maximum resources allowed (container will be throttled/killed if exceeded)
  limits:
    cpu: 1000m # 1 CPU core
    memory: 2Gi # 2 gigabytes

# CronJob cleanup and concurrency settings
# These settings apply to all bot CronJobs
cronjob:
  # Number of successful job runs to keep in history (for monitoring/debugging)
  # Older successful jobs are automatically cleaned up
  successfulJobsHistoryLimit: 3
  # Number of failed job runs to keep in history (for debugging failures)
  failedJobsHistoryLimit: 3
  # Concurrency policy: Forbid = skip new run if previous is still running
  # Other options: Allow (run concurrently), Replace (cancel old, start new)
  concurrencyPolicy: Forbid
  # Maximum time a job can run before being terminated (in seconds)
  # Prevents jobs from hanging indefinitely (30 minutes = 1800 seconds)
  activeDeadlineSeconds: 1800
  # How late a schedule may start before the controller skips it entirely.
  # Applied to the livetrade CronJobs only (see templates/_livetrade.tpl) — a
  # missed bot or reporting run is worth catching up, a missed order-submitting
  # run is not. Keep this comfortably below the gap between livetrade schedules
  # (they are 10 minutes apart) so a skipped run never collides with the next.
  startingDeadlineSeconds: 300
  # Automatically delete completed jobs after this time (in seconds).
  # 1 week so logs of the last 3 runs (retained by history limits) stay viewable.
  ttlSecondsAfterFinished: 604800

# Environment variables injected into all bot containers
# When postgresql.clusterConnection is set, POSTGRES_HOST/PORT/USER/DATABASE come from values
# and POSTGRES_PASSWORD from secret (POSTGRES_URI is not set; app builds it in-cluster).
# Otherwise POSTGRES_URI is read from secret (e.g. localhost for local dev).
env:
- name: POSTGRES_URI
  valueFrom:
    secretKeyRef:
      key: POSTGRES_URI # Used when clusterConnection is not set (e.g. local)

- name: POSTGRES_PASSWORD
  valueFrom:
    secretKeyRef:
      key: POSTGRES_PASSWORD # Required when clusterConnection is set (from .env)

# LangSmith tracing (EU). Add LANGSMITH_API_KEY to your secret (e.g. from .env).
- name: LANGSMITH_API_KEY
  valueFrom:
    secretKeyRef:
      key: LANGSMITH_API_KEY
- name: LANGSMITH_TRACING
  value: "true"
- name: LANGSMITH_ENDPOINT
  value: "https://eu.api.smith.langchain.com"

# OpenRouter API key for AI-based bots (DeepSeekToolBot, etc.)
- name: OPENROUTER_API_KEY
  valueFrom:
    secretKeyRef:
      key: OPENROUTER_API_KEY

# Execution cost model + no-trade band (utils/config.py ExecutionConfig).
# Set explicitly rather than relying on code defaults so rollback is a
# `helm upgrade --set`, not a rebuild. All four at 0/0/1/0 reproduces the
# pre-cost-model behaviour exactly.
#
# STAGE 2 (since 2026-09-21): costs ON, band ON. A trade must exceed
# max($25, 5% of the position) or it is skipped; full exits always trade.
# Stage 1 ($1 / 0%) ran for a full cycle. During it RegimeAdaptiveBot and
# EarningsInsiderTiltBot put 93% / 92% of their trades through at under $25,
# each one paying slippage for no change in exposure. These values also match
# the code defaults, which is what backtest_bot uses, so live and backtest now
# agree. Rollback to stage 1: MIN_TRADE_USD=1, BAND_PCT=0.
- name: EXECUTION_SLIPPAGE_PCT
  value: "0.0005" # 5 bps one-way, mirrors backtest.py
- name: EXECUTION_COMMISSION_PCT
  value: "0.0"
- name: EXECUTION_MIN_TRADE_USD
  value: "25.0"
- name: EXECUTION_REBALANCE_BAND_PCT
  value: "0.05"

# Kronos forecasting service — HF Space URL (public, no secret needed)
- name: KRONOS_SPACE_URL
  value: "https://guestros-kronos-trading-api.hf.space"

# HuggingFace token — required by kronosbot to restart/pause the Space
# Add HF_TOKEN to tradingbot-secrets: kubectl patch secret tradingbot-secrets ...
- name: HF_TOKEN
  valueFrom:
    secretKeyRef:
      key: HF_TOKEN
      optional: true

# Web visualization dashboard settings
visualization:
  enabled: true # Enable/disable the web dashboard
  basicAuth:
    username: admin
    # Password is stored in Kubernetes secret 'app-secrets' with key 'BASIC_AUTH_PASSWORD'
    # Create secret using: kubectl create secret generic app-secrets --from-env-file=.env

    # Kubernetes Ingress configuration for web dashboard
ingress:
  enabled: true # Enable external access to visualization dashboard

# PostgreSQL database configuration
# If enabled, deploys a PostgreSQL instance in the cluster
postgresql:
  enabled: true # Set to false if using external PostgreSQL
  image:
    repository: postgres
    tag: 17-alpine # PostgreSQL version
  # Password is stored in Kubernetes secret 'psqlcreds' with key 'POSTGRES_PASSWORD'
  # Create secret using: kubectl create secret generic psqlcreds --from-env-file=.env
  database: postgres # Database name
  service:
    name: psql-service # Kubernetes service name
    port: 5432 # PostgreSQL port
  # Cluster-internal connection for CronJob bots (overrides POSTGRES_URI from secret).
  # When set, bots get POSTGRES_HOST/PORT/USER/DATABASE from here and POSTGRES_PASSWORD from secret.
  clusterConnection:
    host: psql-service # K8s service name (same namespace) or FQDN
    port: 5432
    user: postgres
    database: postgres
  storage:
    hostPath: /mnt/hdd/tradingbot_2025/psql/ # Persistent storage path on node
    type: DirectoryOrCreate # Create directory if it doesn't exist
  deployment:
    name: psql-deployment
    replicas: 1 # Number of PostgreSQL instances (1 for single-node)

# List of trading bots to deploy
# Each bot will be deployed as a Kubernetes CronJob
#
# Bot naming convention:
# - name: lowercase bot name (e.g., "eurusdtreebot")
# - Script filename: automatically derived as {name}.py (e.g., "eurusdtreebot.py")
# - Container name: automatically generated as "tradingbot-{name}" (removes "bot" suffix)
#
# Schedule format (cron syntax):
#   * * * * *
#   | | | | |
#   | | | | +-- Day of week (0-7, where 0 and 7 are Sunday)
#   | | | +---- Month (1-12)
#   | | +------ Day of month (1-31)
#   | +-------- Hour (0-23)
#   +---------- Minute (0-59)
#
# Common schedule examples:
#   "*/5 * * * 1-5"    - Every 5 minutes, Monday-Friday
#   "0 17 * * 1-5"      - Daily at 5:00 PM, Monday-Friday
#   "0 17 * * 2"        - Weekly on Tuesday at 5:00 PM
#   "0 */4 * * 1-5"     - Every 4 hours, Monday-Friday
#   "30 17 * * 1-5"     - Daily at 5:30 PM, Monday-Friday
# Feeder CronJob for aihedgefundbot (templates/cronjob-ai-hedge-fund.yaml). It
# makes paid LLM calls, so it is paused together with that bot.
aiHedgeFund:
  suspend: true

bots:
- name: eurusdtreebot
  schedule: "*/5 * * * 1-5" # Every 5 minutes, Mon-Fri
  # PAUSED 2026-09-21: alpha vs QQQ -11%/yr, t -2.32 — the only statistically
  # significant result in the fleet, and it is negative. Holds cash.
  suspend: true

- name: feargreedbot
  schedule: "3 17 * * 1-5" # Daily at 5:03 PM, Mon-Fri

- name: swingtitaniumbot
  schedule: "0 */4 * * 1-5" # Every 4 hours, Mon-Fri

- name: xauzenbot
  schedule: "*/5 * * * 1-5" # Every 5 minutes, Mon-Fri

- name: xauaisyntheticmetalbot
  schedule: "*/5 * * * 1-5" # Every 5 minutes, Mon-Fri

- name: sharpeportfoliooptweekly
  schedule: "0 17 * * 2" # Weekly on Tuesday at 5:00 PM

- name: gptbasedstrategytabased
  # 7-day: this bot trades BTC-USD, which does not stop on weekends. The old
  # "1-5" cron silently discarded every Saturday and Sunday signal.
  schedule: "30 17 * * *" # Daily at 5:30 PM UTC, all week

- name: aihedgefundbot
  # Runs after the execution of helm/tradingbots/templates/cronjob-ai-hedge-fund.yaml
  schedule: "10 22 * * 3" # Weekly on Wednesday at 10:10 PM
  # PAUSED 2026-09-21: beta 0.76 with alpha -13%/yr (t -0.36), max DD -15%. That is worse
  # than holding QQQ, and it runs on paid LLM calls. aiHedgeFund.suspend pauses its feeder.
  suspend: true

- name: aideepseektoolbot
  schedule: "18 18 * * 4" #  at 6:18 PM, Thursday
  # PAUSED 2026-09-21: beta 0.67 with alpha -11%/yr (t -0.64). Worse than QQQ, and it
  # runs on paid LLM calls.
  suspend: true

- name: regimeadaptivebot
  schedule: "20 20 * * 3" # Weekly on Wednesday at 8:20 PM

- name: earningsinsidertiltbot
  schedule: "30 20 * * 3" # Weekly on Wednesday at 8:30 PM

- name: taregimebot
  schedule: "20 17 * * 4" # weekly 5:20 PM, Thursday

- name: telegramsignalsbankbot
  schedule: "*/5 * * * *" # Every 5 minutes (matches telegram-monitor cadence)

- name: stocknewssentimentbot
  schedule: "30 22 * * 1-5" # Daily at 10:30 PM UTC Mon-Fri, after portfolio-worth-calculator (0 22) refreshes news
  # PAUSED 2026-09-21: -19% vs QQQ over its live window, alpha -4.9%/yr (t -0.28).
  # Holds ~21 positions, which stay frozen (its curve becomes buy-and-hold of them).
  suspend: true

- name: adaptivemeanreversionbot
  schedule: "0 21 * * 1-5" # Daily 9 PM UTC (4 PM ET), near NYSE close for fresh daily OHLCV

- name: adaptivemeanreversionbtcbot
  # BTC variant of the above — the Hyperliquid vault strategy. 7-day, and timed
  # at the end of the UTC daily bar (yfinance BTC-USD bars roll at 00:00 UTC).
  # livetrade-hyperliquid runs at 00:05 UTC, 15 minutes later.
  schedule: "50 23 * * *" # Daily 11:50 PM UTC, all week

- name: goldenbutterflymombot
  schedule: "0 14 * * 1" # Weekly Monday 2 PM UTC, before US market open

- name: synthesizedhyperconvexitybot
  schedule: "30 21 * * 1-5" # Daily 9:30 PM UTC (30 min after US close), Mon-Fri
  # PAUSED 2026-09-21: 3x TQQQ/SQQQ, alpha -26%/yr (t -0.93), max DD -16%. Holds TQQQ,
  # which stays frozen: liquidate the paper row if you want it flat.
  suspend: true

- name: recursivedecayharvestbot
  schedule: "45 21 * * 1-5" # Daily 9:45 PM UTC (4:45 PM ET), after NYSE close
  # PAUSED 2026-09-21: 3x-levered TQQQ, beta 2.61, alpha -81%/yr (t -1.93), max DD -21%.
  # Holds TQQQ, which stays frozen: liquidate the paper row if you want it flat.
  suspend: true

- name: squeezemomentumbot
  schedule: "55 21 * * 1-5" # Daily 9:55 PM UTC (4:55 PM ET), after NYSE close
  # PAUSED 2026-09-21: alpha vs QQQ -30%/yr (t -1.42), -24% vs QQQ. Holds cash.
  suspend: true

- name: kronosbot
  schedule: "5 22 * * 1-5" # Daily 10:05 PM UTC Mon-Fri (after portfolio-worth-calculator)

- name: kronostraderbot
  schedule: "15 22 * * 1-5" # Daily 10:15 PM UTC Mon-Fri (10 min after kronosbot writes predictions)

# NOTE: the strategy-builder runner is NOT in this list. Entries here use one
# field as both the CronJob's name and its module path, and `run_user_strategies`
# is not a legal Kubernetes object name (RFC 1123 forbids underscores). It has
# its own template, `user-strategies-cronjob.yaml`, exactly as
# calculate_portfolio_worth does.

- name: xauzencarrybot
  # Meta-bot: mirrors xauzenbot's ^XAU position when it has one, else mirrors
  # goldenbutterflymombot's basket. It reads both parents' `bots.portfolio` rows,
  # so it MUST run after them and before any copier that publishes it:
  #   xauzenbot            */5 * * * 1-5   (always fresh)
  #   goldenbutterflymombot 0 14 * * 1     (weekly, well before)
  #   -> xauzencarrybot     35 21 * * 1-5
  #   collective2 copiers   :40 / :50      (see liveTrade below)
  # Moving this later than :40 would publish a stale target for a day.
  schedule: "35 21 * * 1-5" # Daily 9:35 PM UTC Mon-Fri

- name: tsmomtrendbot
  # Long-only time-series momentum across 18 sector-proxy ETFs, each leg sized to
  # constant ex-ante vol. The trend sleeve. Runs after the US close and before the
  # 21:20 IBKR copier. See docs/backtests/tsmomtrendbot.md.
  schedule: "5 21 * * 1-5" # Daily 9:05 PM UTC Mon-Fri

- name: taregimemultiassetbot
  # TARegimeAdaptiveBot's signal, unchanged, across 8 uncorrelated US ETFs. Daily,
  # unlike taregimebot's weekly run, because the backtest that justifies it
  # decides daily. Paper only until it has a live alpha record. See
  # docs/backtests/taregimemultiassetbot.md.
  schedule: "10 21 * * 1-5" # Daily 9:10 PM UTC Mon-Fri

- name: institutionalflowbot
  # Weekly top-10 of the S&P 100 passing institutional mandate filters
  # (liquidity, 200-day trend, QQQ above its 200-day), ranked by volume-based
  # accumulation. Paper only; in no copier's botWeights until its walk-forward
  # alpha clears t >= 2. Friday only: targetWeights re-ranks on Friday bars and
  # returns None (hold) otherwise, identically in the backtest. See
  # docs/backtests/institutionalflowbot.md.
  schedule: "15 21 * * 5" # Fridays 9:15 PM UTC

- name: fundamentalssnapshot
  # Not a bot: records S&P 100 valuation/ownership fundamentals into
  # stock_fundamentals once a day. yfinance serves no fundamentals history, so
  # this is how a point-in-time history gets built. Nothing trades on it yet.
  schedule: "0 23 * * 1-5" # Daily 11:00 PM UTC Mon-Fri

# NOT SCHEDULED — multiassetcarrybot and shortvolcarrybot are implemented,
# tested, and have each been through one round of diagnosed-and-fixed design
# errors. Both improved materially; neither cleared the bar, so neither is
# deployed:
#   * multiassetcarrybot  −2.49% -> −1.36% CAGR over 19.45y. Still negative, and
#     both sleeves still lose independently. The cause is the long-only
#     constraint, not the parameters — do not re-attempt without signed exposure.
#   * shortvolcarrybot    +0.02% -> +0.80% CAGR post-2018 (Sharpe 0.14). The
#     rules are now sound and February 2018 costs −9.1%, but the premium is gone
#     from the −0.5x instrument: unhedged, the short leg's return is negative.
# The measured negative results are the useful part — read
# docs/backtests/multiassetcarrybot.md and docs/backtests/shortvolcarrybot.md
# before rebuilding either idea. Adding a `- name:` block here is all it takes to
# turn one on, so read those first.

# Live Trade Copier — mirrors weighted paper-bot portfolios to a real brokerage.
# See docs/guides/live-trading.md for the full guide.
# Shared settings apply to every enabled broker; broker-specific blocks below
# only carry connection details and per-broker schedules.
liveTrade:
  # Shared across all brokers
  botWeights: '{"SynthesizedHyperConvexityBot": 0.5,"AdaptiveMeanReversionBot": 0.5}' # JSON: bot name -> weight
  minOrderUsd: "50"
  dryRun: "false" # ALWAYS start with true; flip to false only after validation
  strictMapping: "true" # Abort if any target ticker is unmapped
  portfolioFraction: "1.0" # Fraction of broker equity to allocate. 1.0 = all, 0.5 = half. Override per broker below.

  # Collective2 — requires COLLECTIVE2_API_KEY in tradingbot-secrets.
  collective2:
    # DISABLED: strategy 155809898 was handed over to collective2XauZerifine below,
    # which publishes to it. Do NOT re-enable this while that instance points at the
    # same systemId — the two copiers would liquidate each other's positions on every
    # run (the template hard-fails if you try).
    enabled: false
    schedule: "10 21 * * 1-5" # 9:10 PM UTC (10 min after AdaptiveMeanReversionBot at 21:00)
    systemId: "155809898" # Collective2 strategy ID
    # portfolioFraction: "0.5"  # optional: override the shared liveTrade.portfolioFraction for this broker

  # Collective2 "XAUZerifine" — publishes to C2 strategy 155809898, taken over from
  # liveTrade.collective2 (disabled above). C2 API keys are account-scoped and address
  # strategies by numeric StrategyId, so this reuses COLLECTIVE2_API_KEY. The strategy
  # keeps its existing C2 track record.
  #
  # Was '{"XAUZenbotTreeBot": 1.0}' and published NOTHING from 2026-07-06 to 2026-08-24.
  # That bot's whole edge was the single condition "^XAU below 325" — ablated over a
  # year of 1m bars, the bare level rule scores Sharpe 3.02 while the full five-indicator
  # tree scores 1.07, i.e. the indicators subtract ~49pp rather than adding signal.
  # ^XAU crossed 325 in July 2026 and now trades ~420, so the tree returns -1 on every
  # bar and target_weights is always empty. It is not refittable: two scale-free
  # reformulations were tested and both were worse (one +4% against an +81% benchmark,
  # the other negative across all 768 grid points). Do not point this back at
  # XAUZenbotTreeBot without rebuilding that strategy from scratch.
  #
  # These two replace it because they actually hold overnight, which a once-daily
  # 21:50 UTC snapshot can see — XAUZenbotTreeBot round-tripped intraday (buy 17:15,
  # sell 17:55) and was flat by the time the copier looked, so even a working version
  # of it would have been near-invisible at this cadence. QQQ/TQQQ are plain ETFs and
  # need no symbol_map override (unlike ^XAU, which required ^XAU -> GDX).
  collective2XauZerifine:
    enabled: true
    schedule: "50 21 * * 1-5" # 9:50 PM UTC (C2 :10, IB :20, eToro :30, Darwinex :40)
    systemId: "155809898"
    # Switched 2026-09-22 to three low-beta sleeves, inverse-vol weighted, with the
    # weights fit on 2019-01..2023-06 only. Backtest 2019-01..2026-09 (see
    # docs/backtests/c2-blend-2026-09.md): alpha vs QQQ +2.2%/yr (t 0.96) in the
    # first half and +5.0% (t 1.86) in the second; full sample +3.5% at t 2.02,
    # beta 0.13, max DD -8.5%. It is the first candidate in the fleet to clear t >= 2.
    # Low risk, low return: CAGR ~6.6% at ~6% vol, plus T-bill yield on the idle
    # share via the SHV cash proxy.
    # The previous blend (Kronos 0.34 / RegimeAdaptive 0.33 / EarningsInsiderTilt 0.33)
    # made alpha +3% at t 0.25 live, and Kronos's forecast has no measurable signal.
    # TARegimeMultiAssetBot starts in cash and funds a sleeve only on a buy signal,
    # so its share sits in SHV until signals fire. Legs C2 cannot trade are dropped
    # to cash by Collective2Broker.is_tradeable, not redistributed.
    botWeights: '{"TARegimeMultiAssetBot": 0.39,"TSMOMTrendBot": 0.24,"GoldenButterflyMomBot": 0.37}'
    # LIVE, and now genuinely reconciling. sync() is a full target-state sync, so the
    # first run with a non-empty target WILL liquidate whatever strategy 155809898 still
    # holds from the old handover and rebuild to QQQ/TQQQ. That did not happen while the
    # target was empty (sync() early-returns at copier.py:44), which is why those stale
    # positions survived untouched until now.
    dryRun: "false"
    # apiKeySecretKey: "COLLECTIVE2_API_KEY_XAUZERIFINE" # optional: only if a different C2 account
    # portfolioFraction: "0.5" # optional: override the shared liveTrade.portfolioFraction

  # Interactive Brokers — IBKR Web API (Client Portal) via headless OAuth 1.0a.
  # Requires in tradingbot-secrets: IB_ACCOUNT_ID, IBIND_OAUTH1A_CONSUMER_KEY,
  # IBIND_OAUTH1A_ACCESS_TOKEN, IBIND_OAUTH1A_ACCESS_TOKEN_SECRET, IBIND_OAUTH1A_DH_PRIME.
  # Requires a separate secret (oauthKeysSecret) holding private_encryption.pem and
  # private_signature.pem, mounted at /etc/ibkr. No IB Gateway / NetworkPolicy needed.
  #
  # DISABLED: none of the IBIND_OAUTH1A_* keys nor the ib-oauth-keys secret exist yet.
  # IBKR self-service OAuth 1.0a requires registering a consumer key + your RSA public
  # keys with IBKR and waiting for approval. Flip to true only once both secrets exist,
  # and do one run with liveTrade.dryRun="true" first.
  interactiveBrokers:
    enabled: true
    schedule: "20 21 * * 1-5" # 9:20 PM UTC
    oauthKeysSecret: "ib-oauth-keys" # secret with private_encryption.pem & private_signature.pem
    # portfolioFraction: "0.5"  # optional: override the shared liveTrade.portfolioFraction for this broker

  # eToro — requires ETORO_API_KEY and ETORO_USER_KEY in tradingbot-secrets.
  etoro:
    enabled: false
    schedule: "30 21 * * 1-5" # 9:30 PM UTC
    demo: true
    # portfolioFraction: "0.5"  # optional: override the shared liveTrade.portfolioFraction for this broker

  # Darwinex — requires DARWINEX_USERNAME and DARWINEX_PASSWORD in tradingbot-secrets.
  #
  # BLOCKED, and not by credentials. DarwinexBroker speaks the DXtrade REST API
  # (/dxsca-web), and DXtrade carries ONLY forex, indices and commodities. Darwinex's
  # ~800 US stocks and ~100 US ETFs are MetaTrader 5 only, so no equity/ETF ticker in
  # this fleet is reachable from here — including the ^XAU -> GDX mapping that makes
  # XAUZenbotTreeBot tradeable on Collective2. Reaching MT5 needs an EA bridge
  # (DWX Connect), not a config change.
  #
  # Login also returns 403 "RBAC: access denied", consistent with the account being
  # Darwinex Zero, which is MT4/MT5 only and has no DXtrade entitlement at all.
  #
  # Do NOT "fix" this by mapping ^XAU -> XAUUSD. XAUZenbotTreeBot's signal is computed
  # on the PHLX gold/silver MINERS index; its measured beta to bullion was 0.14, so
  # spot gold is a different strategy, not a proxy.
  darwinex:
    enabled: false
    schedule: "40 21 * * 1-5" # 9:40 PM UTC
    demo: true
    # accountId: "12345" # optional: defaults to first found account
    # portfolioFraction: "0.5"  # optional: override the shared liveTrade.portfolioFraction for this broker

  # Hyperliquid perps — the DataFortress Omni user vault.
  # Requires HYPERLIQUID_PRIVATE_KEY (an API/agent wallet key, NOT the leader's
  # master key) and HYPERLIQUID_ACCOUNT_ADDRESS in tradingbot-secrets.
  #
  # Unlike every other broker here this is PERPS, not spot, so three settings are
  # load-bearing and must not be "tidied up":
  #   - portfolioFraction 0.95, not 1.0. The copier clamps buys to
  #     get_cash() * 0.98; at 1.0 the target notional exceeds that budget every
  #     run, so it scales every order down and sits on the margin boundary.
  #   - minOrderUsd 25, above Hyperliquid's exchange-enforced $10 floor with
  #     headroom for that same 0.98 scale-down. Raise it toward 1-2% of vault
  #     equity once TVL passes ~$50k or the vault churns taker fees every run.
  #   - The broker forces 1x cross leverage before the first opening order, so
  #     the exchange rejects anything above account value rather than levering.
  #
  # DISABLED until rollout stage 3. See docs/guides/live-trading.md for the
  # staged testnet -> mainnet -> vault sequence; do not skip stages.
  hyperliquid:
    enabled: false
    schedule: "5 0 * * *" # 00:05 UTC daily, 7 days — BTC trades all week
    equitySchedule: "5 23 * * *" # standalone live_equity snapshot, keeps the curve gapless
    testnet: "true" # string, not bool — read as an env var
    vaultAddress: "" # empty = the leader's own account (mainnet smoke stage only)
    # allowMainnetWithoutVault: "true"  # required to render mainnet with no vault
    botWeights: '{"AdaptiveMeanReversionBTCBot": 1.0}' # one strategy, not the book
    minOrderUsd: "25"
    portfolioFraction: "0.95"
    dryRun: "true" # ALWAYS start with true

# telegram monitor
telegramMonitor:
  enabled: true # Set to true to deploy the Telegram monitor CronJob
  schedule: "*/5 * * * *" # Every 5 minutes
  # Comma-separated Telegram channel usernames or IDs to monitor
  # Examples: "durov", "some_news_channel", "-1001234567890"
  channels: "-1002202241417,-1001998690333"
  # Number of recent messages to fetch per channel per run
  fetchLimit: "50"
