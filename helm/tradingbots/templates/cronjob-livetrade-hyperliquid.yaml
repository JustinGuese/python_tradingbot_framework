{{- if .Values.liveTrade.hyperliquid.enabled }}
{{- if and (not (eq (toString .Values.liveTrade.hyperliquid.testnet) "true")) (not .Values.liveTrade.hyperliquid.vaultAddress) }}
{{- if ne (toString .Values.liveTrade.hyperliquid.allowMainnetWithoutVault) "true" }}
{{- fail "liveTrade.hyperliquid: MAINNET with no vaultAddress trades the leader's own funds. Set vaultAddress, or set allowMainnetWithoutVault: \"true\" for the deliberate mainnet smoke stage." }}
{{- end }}
{{- end }}
{{- include "tradingbots.livetrade.header" (dict "root" $ "name" "livetrade-hyperliquid" "schedule" .Values.liveTrade.hyperliquid.schedule "module" "tradingbot.livetrade_hyperliquid") }}
{{- include "tradingbots.livetrade.commonEnv" (dict "root" $) }}
            # Hyperliquid credentials (from secret). The private key is an API
            # (agent) wallet key, not the leader's master key.
            - name: HYPERLIQUID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: HYPERLIQUID_PRIVATE_KEY
            - name: HYPERLIQUID_ACCOUNT_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: HYPERLIQUID_ACCOUNT_ADDRESS
            # Empty = trade the leader's own account (mainnet smoke stage only).
            - name: HYPERLIQUID_VAULT_ADDRESS
              value: {{ $.Values.liveTrade.hyperliquid.vaultAddress | default "" | quote }}
            - name: HYPERLIQUID_TESTNET
              value: {{ $.Values.liveTrade.hyperliquid.testnet | quote }}
            # portfolioFraction is 0.95, not 1.0 — at 1.0 the copier's cash clamp
            # scales every order down and sits on the margin boundary. The value
            # lives in values.yaml; the code-side default is in livetrade/registry.py.
{{- include "tradingbots.livetrade.configEnv" (dict "root" $ "cfg" .Values.liveTrade.hyperliquid) }}
          restartPolicy: OnFailure
{{- end }}
