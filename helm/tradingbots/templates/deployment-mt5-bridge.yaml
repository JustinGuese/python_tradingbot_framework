{{- $bridge := .Values.mt5Bridge | default dict -}}
{{- if $bridge.enabled }}
# MetaTrader 5 Bridge: self-hosted Wine + MetaTrader 5 + mt5linux (RPyC server).
# Single-replica Deployment with strategy: Recreate (Wine terminal state and PVC
# must not be attached concurrently to multiple pods).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $bridge.name | default "mt5-bridge" }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mt5-bridge
  template:
    metadata:
      labels:
        app: mt5-bridge
    spec:
      {{- $pullSecrets := $bridge.imagePullSecrets | default $.Values.imagePullSecrets -}}
      {{- if $pullSecrets }}
      imagePullSecrets:
      {{- range $pullSecrets }}
      - name: {{ .name }}
      {{- end }}
      {{- end }}
      containers:
      - name: mt5-bridge
        image: {{ $bridge.image | default "registry.gitlab.com/datafortress/tradingbot25/mt5-bridge:main" | quote }}
        imagePullPolicy: {{ $bridge.imagePullPolicy | default "Always" | quote }}
        ports:
        - name: rpyc
          containerPort: {{ $bridge.port | default 8001 }}
          protocol: TCP
        - name: vnc
          containerPort: 3000
          protocol: TCP
        {{- if $bridge.startupProbe }}
        startupProbe:
          {{- toYaml $bridge.startupProbe | nindent 10 }}
        {{- else }}
        startupProbe:
          tcpSocket:
            port: {{ $bridge.port | default 8001 }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        {{- end }}
        {{- if $bridge.readinessProbe }}
        readinessProbe:
          {{- toYaml $bridge.readinessProbe | nindent 10 }}
        {{- else }}
        readinessProbe:
          tcpSocket:
            port: {{ $bridge.port | default 8001 }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- end }}
        resources:
          {{- if $bridge.resources }}
          {{- toYaml $bridge.resources | nindent 10 }}
          {{- else }}
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 4Gi
          {{- end }}
        {{- if or $bridge.env $bridge.customUser $bridge.password $bridge.mt5CmdOptions }}
        env:
        {{- if $bridge.customUser }}
        - name: CUSTOM_USER
          value: {{ $bridge.customUser | quote }}
        {{- end }}
        {{- if $bridge.password }}
        - name: PASSWORD
          value: {{ $bridge.password | quote }}
        {{- end }}
        {{- if $bridge.mt5CmdOptions }}
        - name: MT5_CMD_OPTIONS
          value: {{ $bridge.mt5CmdOptions | quote }}
        {{- end }}
        {{- if $bridge.env }}
        {{- toYaml $bridge.env | nindent 8 }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: mt5-bridge-config
          mountPath: /config
      volumes:
      - name: mt5-bridge-config
        persistentVolumeClaim:
          claimName: {{ $bridge.pvcName | default "mt5-bridge-config" }}
{{- end }}
