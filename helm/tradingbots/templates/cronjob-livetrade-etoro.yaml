{{- if .Values.liveTrade.etoro.enabled }}
{{- include "tradingbots.livetrade.header" (dict "root" $ "name" "livetrade-etoro" "schedule" .Values.liveTrade.etoro.schedule "module" "tradingbot.livetrade_etoro") }}
{{- include "tradingbots.livetrade.commonEnv" (dict "root" $) }}
            # eToro credentials (from secret)
            - name: ETORO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: ETORO_API_KEY
            - name: ETORO_USER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: ETORO_USER_KEY
            - name: ETORO_DEMO
              value: {{ $.Values.liveTrade.etoro.demo | quote }}
{{- include "tradingbots.livetrade.configEnv" (dict "root" $ "cfg" .Values.liveTrade.etoro) }}
          restartPolicy: OnFailure
{{- end }}
