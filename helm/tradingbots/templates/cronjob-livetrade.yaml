{{- if .Values.liveTrade.collective2.enabled }}
{{- include "tradingbots.livetrade.header" (dict "root" $ "name" "livetrade-collective2" "schedule" .Values.liveTrade.collective2.schedule "module" "tradingbot.livetrade_collective2") }}
{{- include "tradingbots.livetrade.commonEnv" (dict "root" $) }}
            # Collective2 credentials (from secret)
            - name: COLLECTIVE2_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: COLLECTIVE2_API_KEY
            - name: COLLECTIVE2_SYSTEM_ID
              value: {{ $.Values.liveTrade.collective2.systemId | quote }}
{{- include "tradingbots.livetrade.configEnv" (dict "root" $ "cfg" .Values.liveTrade.collective2) }}
          restartPolicy: OnFailure
{{- end }}
