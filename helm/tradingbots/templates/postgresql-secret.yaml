{{- /*
  NOTE: This secret template is no longer used. Secrets should be created manually
  using kubectl before deploying the Helm chart.
  
  Required secret (name defined in values.yaml under .Values.secretName):
  {{ .Values.secretName }} - Contains all secrets:
     - POSTGRES_PASSWORD: PostgreSQL database password
     - POSTGRES_URI: Connection string for main database (e.g., "postgres:password@psql-service:5432/postgres")
     - POSTGRES_URI_AI_HEDGE_FUND: Connection string for ai_hedge_fund database (e.g., "postgres:password@psql-service:5432/ai_hedge_fund")
     - BASIC_AUTH_PASSWORD: Password for visualization dashboard basic auth
     - OPENROUTER_API_KEY: API key for OpenRouter (used by aihedgefundbot)
  
  Create/update it with ske (source of truth: .env.secret.enc, committed; config in
  [tool.ske] in pyproject.toml):
    ske decrypt      # .env.secret.enc -> .env.secret (gitignored)
    ske diff         # live Secret/ConfigMap vs the files, read-only
    ske apply        # create/update; then `kubectl rollout restart` any Deployment
    ske edit         # change one credential without plaintext touching the tree
  
  See README.md for detailed instructions.
*/ -}}

