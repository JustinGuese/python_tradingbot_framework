{{- if .Values.eventLogger.enabled }}
# Long-running, not a CronJob: the logger polls feeds every few seconds and prices the
# watchlist at fixed offsets after each event. Replicas MUST stay 1 (dedupe is per row, but
# two loggers would double the load and halve nothing). It only writes world_events /
# event_price_snapshots and never trades.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventlogger
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: eventlogger
  template:
    metadata:
      labels:
        app: eventlogger
    spec:
      imagePullSecrets:
      {{- range $.Values.imagePullSecrets }}
      - name: {{ .name }}
      {{- end }}
      containers:
      - name: eventlogger
        image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
        command:
        - "python"
        args:
        - "-m"
        - "tradingbot.eventlogger"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        resources:
          {{- toYaml $.Values.eventLogger.resources | nindent 10 }}
        env:
        {{- if $.Values.postgresql.clusterConnection }}
        - name: POSTGRES_HOST
          value: {{ $.Values.postgresql.clusterConnection.host | quote }}
        - name: POSTGRES_PORT
          value: {{ $.Values.postgresql.clusterConnection.port | quote }}
        - name: POSTGRES_USER
          value: {{ $.Values.postgresql.clusterConnection.user | quote }}
        - name: POSTGRES_DATABASE
          value: {{ $.Values.postgresql.clusterConnection.database | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secretName }}
              key: POSTGRES_PASSWORD
        {{- end }}
        {{- range $.Values.env }}
        {{- if and $.Values.postgresql.clusterConnection (or (eq .name "POSTGRES_URI") (eq .name "POSTGRES_PASSWORD")) }}
        {{- else }}
        - name: {{ .name }}
        {{- if .value }}
          value: {{ .value | quote }}
        {{- else if .valueFrom }}
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secretName }}
              key: {{ .valueFrom.secretKeyRef.key }}
              {{- if .valueFrom.secretKeyRef.optional }}
              optional: true
              {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        - name: ALPACA_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secretName }}
              key: ALPACA_API_KEY
              optional: true
        - name: ALPACA_API_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $.Values.secretName }}
              key: ALPACA_API_SECRET
              optional: true
        {{- if $.Values.eventLogger.rssFeeds }}
        - name: EVENT_RSS_FEEDS
          value: {{ $.Values.eventLogger.rssFeeds | quote }}
        {{- end }}
        {{- if $.Values.eventLogger.watchlist }}
        - name: EVENT_WATCHLIST
          value: {{ $.Values.eventLogger.watchlist | quote }}
        {{- end }}
{{- end }}
