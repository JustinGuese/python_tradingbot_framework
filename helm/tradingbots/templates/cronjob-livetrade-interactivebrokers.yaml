{{- if .Values.liveTrade.interactiveBrokers.enabled }}
{{- $ib := .Values.liveTrade.interactiveBrokers }}
{{- /* ib-gateway-client=true is what the gateway's NetworkPolicy admits; without it the connect hangs. */}}
{{- include "tradingbots.livetrade.header" (dict "root" $ "name" "livetrade-ib" "schedule" $ib.schedule "module" "tradingbot.livetrade_interactive_brokers" "podLabels" (dict "ib-gateway-client" "true")) }}
{{- include "tradingbots.livetrade.commonEnv" (dict "root" $) }}
            # IB Gateway (TWS socket API) deployed in its own namespace. The login,
            # 2FA and daily restart live in the gateway; this job only opens a socket.
            - name: IB_ACCOUNT_ID
              value: {{ required "liveTrade.interactiveBrokers.accountId is required" $ib.accountId | quote }}
            - name: IB_GATEWAY_HOST
              value: {{ $ib.gatewayHost | default "ib-gateway-service.interactivebrokersgateway" | quote }}
            - name: IB_GATEWAY_PORT
              value: {{ $ib.gatewayPort | default "4002" | quote }}
            # Stable clientId: cancel_open_orders only sees orders under the same id.
            - name: IB_CLIENT_ID
              value: {{ $ib.clientId | default "17" | quote }}
{{- include "tradingbots.livetrade.configEnv" (dict "root" $ "cfg" $ib) }}
          restartPolicy: OnFailure
{{- end }}
