{{- if .Values.liveTrade.interactiveBrokers.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: livetrade-ib
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace }}
spec:
  schedule: {{ $.Values.liveTrade.interactiveBrokers.schedule | quote }}
  successfulJobsHistoryLimit: {{ $.Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $.Values.cronjob.failedJobsHistoryLimit }}
  concurrencyPolicy: {{ $.Values.cronjob.concurrencyPolicy }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ $.Values.cronjob.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $.Values.cronjob.ttlSecondsAfterFinished }}
      template:
        spec:
          imagePullSecrets:
          {{- range $.Values.imagePullSecrets }}
          - name: {{ .name }}
          {{- end }}
          containers:
          - name: livetrade-ib
            image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
            command:
            - "python"
            args:
            - "livetrade_interactive_brokers.py"
            imagePullPolicy: {{ $.Values.image.pullPolicy }}
            resources:
              {{- toYaml $.Values.resources | nindent 14 }}
            env:
            {{- if $.Values.postgresql.clusterConnection }}
            - name: POSTGRES_HOST
              value: {{ $.Values.postgresql.clusterConnection.host | quote }}
            - name: POSTGRES_PORT
              value: {{ $.Values.postgresql.clusterConnection.port | quote }}
            - name: POSTGRES_USER
              value: {{ $.Values.postgresql.clusterConnection.user | quote }}
            - name: POSTGRES_DATABASE
              value: {{ $.Values.postgresql.clusterConnection.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- range $.Values.env }}
            {{- if and $.Values.postgresql.clusterConnection (or (eq .name "POSTGRES_URI") (eq .name "POSTGRES_PASSWORD")) }}
            {{- else }}
            - name: {{ .name }}
            {{- if .value }}
              value: {{ .value | quote }}
            {{- else if .valueFrom }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ .valueFrom.secretKeyRef.key }}
            {{- end }}
            {{- end }}
            {{- end }}
            # IBKR Web API (Client Portal) OAuth 1.0a — fully headless, no gateway.
            - name: IB_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: IB_ACCOUNT_ID
            - name: IBIND_USE_OAUTH
              value: "True"
            - name: IBIND_OAUTH1A_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: IBIND_OAUTH1A_CONSUMER_KEY
            - name: IBIND_OAUTH1A_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: IBIND_OAUTH1A_ACCESS_TOKEN
            - name: IBIND_OAUTH1A_ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: IBIND_OAUTH1A_ACCESS_TOKEN_SECRET
            - name: IBIND_OAUTH1A_DH_PRIME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: IBIND_OAUTH1A_DH_PRIME
            # Private key files mounted from the ib-oauth-keys secret (see volumes below).
            - name: IBIND_OAUTH1A_ENCRYPTION_KEY_FP
              value: "/etc/ibkr/private_encryption.pem"
            - name: IBIND_OAUTH1A_SIGNATURE_KEY_FP
              value: "/etc/ibkr/private_signature.pem"
            # LiveTrade shared configuration (from values.yaml)
            - name: LIVETRADE_BOT_WEIGHTS
              value: {{ $.Values.liveTrade.botWeights | quote }}
            - name: LIVETRADE_MIN_ORDER_USD
              value: {{ $.Values.liveTrade.minOrderUsd | quote }}
            - name: LIVETRADE_DRY_RUN
              value: {{ $.Values.liveTrade.dryRun | quote }}
            - name: LIVETRADE_STRICT_MAPPING
              value: {{ $.Values.liveTrade.strictMapping | quote }}
            - name: LIVETRADE_PORTFOLIO_FRACTION
              value: {{ default $.Values.liveTrade.portfolioFraction $.Values.liveTrade.interactiveBrokers.portfolioFraction | quote }}
            volumeMounts:
            - name: ib-oauth-keys
              mountPath: /etc/ibkr
              readOnly: true
          volumes:
          - name: ib-oauth-keys
            secret:
              secretName: {{ $.Values.liveTrade.interactiveBrokers.oauthKeysSecret | default "ib-oauth-keys" }}
              items:
              - key: private_encryption.pem
                path: private_encryption.pem
              - key: private_signature.pem
                path: private_signature.pem
          restartPolicy: OnFailure
{{- end }}
