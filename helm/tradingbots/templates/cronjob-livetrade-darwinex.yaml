{{- if .Values.liveTrade.darwinex.enabled }}
{{- include "tradingbots.livetrade.header" (dict "root" $ "name" "livetrade-darwinex" "schedule" .Values.liveTrade.darwinex.schedule "module" "tradingbot.livetrade_darwinex") }}
{{- include "tradingbots.livetrade.commonEnv" (dict "root" $) }}
            # Darwinex credentials (from secret)
            - name: DARWINEX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: DARWINEX_USERNAME
            - name: DARWINEX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: DARWINEX_PASSWORD
            - name: DARWINEX_ACCOUNT_ID
              value: {{ $.Values.liveTrade.darwinex.accountId | default "" | quote }}
            - name: DARWINEX_DEMO
              value: {{ $.Values.liveTrade.darwinex.demo | quote }}
{{- include "tradingbots.livetrade.configEnv" (dict "root" $ "cfg" .Values.liveTrade.darwinex) }}
          restartPolicy: OnFailure
{{- end }}
