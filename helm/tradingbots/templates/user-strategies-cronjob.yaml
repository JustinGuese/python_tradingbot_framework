{{/*
The single CronJob behind the strategy builder.

User strategies are rows in `userstrategy` (owned by tradingbot-ui-backend),
not modules, so one generic runner covers all of them: no per-user CronJob, no
generated manifests, and nothing needing RBAC to create Kubernetes objects.

It has its own template rather than an entry under .Values.bots because that
loop uses a single field as both the CronJob name and the module path, and
`run_user_strategies` is not a legal Kubernetes object name — RFC 1123 allows
only lowercase alphanumerics, '-' and '.'. `calculate_portfolio_worth` is
handled the same way, for the same reason.

Scheduled at 21:45, before portfolio-worth-calculator at 22:00, so a strategy's
trades and the equity snapshot that measures them land on the same day.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: user-strategies-runner
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: {{ $.Release.Name }}
    meta.helm.sh/release-namespace: {{ $.Release.Namespace }}
spec:
  schedule: "45 21 * * 1-5"
  successfulJobsHistoryLimit: {{ $.Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $.Values.cronjob.failedJobsHistoryLimit }}
  # Forbid, not Replace: a run that is still working through the strategy list
  # must finish rather than be restarted from the top, or strategies early in
  # the list trade twice.
  concurrencyPolicy: {{ $.Values.cronjob.concurrencyPolicy }}
  jobTemplate:
    spec:
      # Strategies run serially. As the number of live ones grows this is the
      # limit that will bite first; market data is DB-cached and shared across
      # strategies, so the per-strategy cost is small but not zero.
      activeDeadlineSeconds: {{ $.Values.cronjob.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: {{ $.Values.cronjob.ttlSecondsAfterFinished }}
      template:
        spec:
          imagePullSecrets:
          {{- range $.Values.imagePullSecrets }}
          - name: {{ .name }}
          {{- end }}
          containers:
          - name: user-strategies-runner
            image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
            command:
            - "python"
            args:
            - "-m"
            - "tradingbot.run_user_strategies"
            imagePullPolicy: {{ $.Values.image.pullPolicy }}
            resources:
              {{- toYaml $.Values.resources | nindent 14 }}
            env:
            {{- if $.Values.postgresql.clusterConnection }}
            - name: POSTGRES_HOST
              value: {{ $.Values.postgresql.clusterConnection.host | quote }}
            - name: POSTGRES_PORT
              value: {{ $.Values.postgresql.clusterConnection.port | quote }}
            - name: POSTGRES_USER
              value: {{ $.Values.postgresql.clusterConnection.user | quote }}
            - name: POSTGRES_DATABASE
              value: {{ $.Values.postgresql.clusterConnection.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- range $.Values.env }}
            {{- if and $.Values.postgresql.clusterConnection (or (eq .name "POSTGRES_URI") (eq .name "POSTGRES_PASSWORD")) }}
            {{- else }}
            - name: {{ .name }}
            {{- if .value }}
              value: {{ .value | quote }}
            {{- else if .valueFrom }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ .valueFrom.secretKeyRef.key }}
            {{- end }}
            {{- end }}
            {{- end }}
          restartPolicy: OnFailure
