# Test, build on the node's Docker, deploy the Helm chart -- see datafortress/gitlab-df-template.
#
# Every bot is a CronJob on $CI_REGISTRY_IMAGE:main (no Deployment runs it), so
# CRONJOB_ONLY is "true": the next CronJob run pulls the fresh :main
# (pullPolicy: Always). IMAGE is the template default, :main on the default
# branch, and MUST match helm's image.tag below -- deploying any tag nothing
# publishes sends the whole fleet to ImagePullBackOff ("manifest unknown"),
# which is what happened between 2026-08-18 and 2026-08-21.
#
# Only main deploys (the template's deploy rule). Without that a refactor branch
# would deploy itself, which makes it impossible to land a multi-commit change
# (e.g. an import rewrite and its matching CronJob invocation) as one atomic
# production cutover.

include:
  - project: datafortress/gitlab-df-template
    file: [templates/build.yml, templates/deploy-helm.yml]

variables:
  NAMESPACE: tradingbots-2025
  RELEASE: tradingbots
  HELM_CHART: ./helm/tradingbots
  CRONJOB_ONLY: "true"
  # Deploys trading bots and PostgreSQL. image.tag is the default branch's slug.
  HELM_ARGS: --create-namespace --set image.tag=main

pytest:
  stage: test
  image: python:3.12-slim
  variables:
    # db.py resolves DATABASE_URL and calls create_engine() at import time, so
    # importing anything in the package needs this set. create_engine does not
    # connect, so a syntactically valid bogus URI is enough — and it must stay
    # bogus, so a test that escapes its mocks fails instead of touching a real DB.
    POSTGRES_URI: "postgresql://ci:ci@localhost:5432/ci"
  before_script:
  # git is required, not optional: pyproject pins imbalanced-learn to a git
  # source ([tool.uv.sources]), so `uv sync` shells out to git to fetch it and
  # fails with "Git executable not found" on python:3.12-slim, which ships
  # without it. The failure happens during dependency resolution, so the whole
  # job dies before a single test runs.
  - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
  - pip install uv
  # --extra dev is the optional-dependencies group holding pytest/pytest-mock;
  # the [dependency-groups] dev group (ruff, mypy) is synced by default.
  - uv sync --frozen --extra dev
  script:
  - uv run ruff check .
  - uv run ruff format --check .
  - uv run pytest tests/ -q

# Build only after tests pass.
build-docker:
  needs: [pytest]
